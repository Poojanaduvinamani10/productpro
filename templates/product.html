<!DOCTYPE html>
<html>
<head>
    <title>Product Details</title>
    
</head>

<body>

    <h1>Product Details</h1>
    <form method ="GET">
        <input type="text" name="search" placeholder="search product name...." value="{{request.GET.search}}">
        <button>Submit</button>
        <a href="{% url 'display' %}">Clear</a>
    </form>
    <br><br>
            <table border ="2">
                <tr>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Image</th>
                </tr>
            {% for i in prod %}
            <tr>
               <td> {{ i.name }}</td>
               <td> {{ i.price }}</td>
               <td> {{ i.quantity }}</td>
               <td> <img src="{{ i.img.url }}"  height="80px" width="80px"></td>
               <td><a href ="{% url 'update' i.id %}">Update</a></td>
               <td><a href ="{% url 'delete1' i.id %}">Delete</a></td>
            </tr>
             {% endfor %}
            </table>
      <a href ="{% url 'insert' %}">insert</a>

</body>
</html>
